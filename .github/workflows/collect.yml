name: Collecte des données (OpenStreetMap)

on:
  workflow_dispatch:
  push:
    paths:
      - scripts/collect_osm.py
      - .github/workflows/collect.yml
  schedule:
    - cron: "17 3 1 * *"   # le 1er de chaque mois, mise à jour complète

permissions:
  contents: write

concurrency:
  group: collect
  cancel-in-progress: true

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Installer les outils
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq osmium-tool
          pip install numpy
          df -h / | tail -1
      - name: Collecte (cartes OpenStreetMap par pays)
        run: python3 scripts/collect_osm.py
      - name: Enregistrer les données
        if: always()
        run: |
          git config user.name "collecte-auto"
          git config user.email "noreply@users.noreply.github.com"
          git add data/
          git diff --cached --quiet || (git commit -m "Données OpenStreetMap : mise à jour automatique" && git pull --rebase -q && git push)

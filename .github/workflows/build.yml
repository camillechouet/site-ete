name: Construire et publier le site

# Se lance à chaque modification (config.json, data/…) et peut être lancé à la main (onglet Actions > Run workflow).
# Publication en pause : on ne la lance qu'à la main tant que le site n'est pas prêt (voir README).
on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Construire le site (et vérifier les liens)
        run: python3 scripts/build.py --check
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

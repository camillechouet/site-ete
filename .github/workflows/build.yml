name: Construire et publier le site

# Se lance à chaque modification (config.json, data/, scripts/, assets/), chaque mois (après les collectes)
# et peut être lancé à la main (onglet Actions > Run workflow).
on:
  workflow_dispatch:
  push:
    paths:
      - config.json
      - data/**
      - scripts/build.py
      - scripts/generate_content.py
      - assets/**
      - .github/workflows/build.yml
  schedule:
    - cron: "30 6 3 * *"   # le 3 de chaque mois : republie avec les données fraîchement collectées

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Générer duels et articles à partir des mesures
        run: python3 scripts/generate_content.py
      - name: Construire le site (et vérifier les liens)
        run: python3 scripts/build.py --check
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

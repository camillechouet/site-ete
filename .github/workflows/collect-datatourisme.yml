name: Collecte des activités (DATAtourisme)

on:
  workflow_dispatch:
  push:
    paths:
      - scripts/collect_datatourisme.py
      - .github/workflows/collect-datatourisme.yml
  schedule:
    - cron: "43 4 2 * *"   # le 2 de chaque mois

permissions:
  contents: write

concurrency:
  group: collect-dt
  cancel-in-progress: true

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Collecte DATAtourisme
        env:
          DATATOURISME_KEY: ${{ secrets.DATATOURISME_KEY }}
          REFRESH: ${{ github.event_name == 'schedule' && '1' || '0' }}
        run: python3 scripts/collect_datatourisme.py
      - name: Enregistrer les données
        if: always()
        run: |
          git config user.name "collecte-auto"
          git config user.email "noreply@users.noreply.github.com"
          git add data/
          git diff --cached --quiet || (git commit -m "Données DATAtourisme : mise à jour automatique" && git pull --rebase -q && git push)
